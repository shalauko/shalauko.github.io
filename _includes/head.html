{%- seo -%}

{%- if page.math %}
<script>
  window.MathJax = {
    tex: {
      /* kramdown emits \( \) inline and \[ \] for display; $$ kept as a
         safety net. Bare $...$ is deliberately NOT enabled so prose like
         "costs $5" is never mistaken for math. */
      inlineMath: [['\\(', '\\)']],
      displayMath: [['\\[', '\\]'], ['$$', '$$']],
      processEscapes: true
    },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
</script>
<script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@{{ site.mathjax_version }}/es5/tex-mml-chtml.js"></script>
{%- endif %}
